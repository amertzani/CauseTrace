name: Build and Push Docker Images

on:
  push:
    branches:
      - test-deployment
      - main
    paths:
      - 'Dockerfile.backend'
      - 'RandDKnowledgeGraph/Dockerfile.frontend'
      - 'docker-compose.yml'
      - 'api_server.py'
      - 'requirements*.txt'
      - 'RandDKnowledgeGraph/**'
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/enesy-backend:latest
            ghcr.io/${{ github.repository_owner }}/enesy-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./RandDKnowledgeGraph
          file: ./RandDKnowledgeGraph/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/enesy-frontend:latest
            ghcr.io/${{ github.repository_owner }}/enesy-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || 'http://backend:8001' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
